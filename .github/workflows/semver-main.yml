name: Semver Checks (main)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semver:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select semver baseline
      id: semver-baseline
      shell: bash
      run: |
        set -euo pipefail

        if baseline_rev=$(git rev-parse --verify --quiet "refs/tags/3.0.0^{commit}"); then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "baseline_rev=$baseline_rev" >> "$GITHUB_OUTPUT"
          echo "Using 3.0.0 as semver baseline."
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Tag 3.0.0 does not exist yet; skipping semver checks until it is available."
        fi

    - name: Install system dependencies
      if: steps.semver-baseline.outputs.available == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwayland-dev pkg-config

    - name: Install Rust toolchain
      if: steps.semver-baseline.outputs.available == 'true'
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-semver-checks
      if: steps.semver-baseline.outputs.available == 'true'
      uses: taiki-e/install-action@cargo-semver-checks

    - name: Check core API compatibility against 3.0.0
      if: steps.semver-baseline.outputs.available == 'true'
      run: cargo semver-checks check-release --manifest-path Cargo.toml --baseline-rev "${{ steps.semver-baseline.outputs.baseline_rev }}" --release-type patch --only-explicit-features

    - name: Check default-feature API compatibility against 3.0.0
      if: steps.semver-baseline.outputs.available == 'true'
      run: cargo semver-checks check-release --manifest-path Cargo.toml --baseline-rev "${{ steps.semver-baseline.outputs.baseline_rev }}" --release-type patch --default-features

    - name: Check visualization API compatibility against 3.0.0
      if: steps.semver-baseline.outputs.available == 'true'
      run: cargo semver-checks check-release --manifest-path Cargo.toml --baseline-rev "${{ steps.semver-baseline.outputs.baseline_rev }}" --release-type patch --default-features --features visualization
