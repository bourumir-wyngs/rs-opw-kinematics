  <title id="opw-title">Eight IK branches for one flange pose</title>
  <desc id="opw-desc">Six-axis OPW robot viewed along the flange axis. The columns show First shoulder with Positive and Negative elbows, then Second shoulder with Positive and Negative elbows. The top row shows Principal wrist, indices 0–3. The bottom row shows Flipped wrist, indices 4–7. The orange arrow starts at the wrist and shows the positive J5 axis. Every arrow is parallel to the page and reverses within each column.</desc>
